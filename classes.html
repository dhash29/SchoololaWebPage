<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .formField {
            width: 100%;
            max-width: 280px; 
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            background: #f9f9f9;
            color: #333;
            box-sizing: border-box;
        }
        #closeClassModalBtn {
            position: absolute;
            top: 12px;
            right: 24px;
            background: none;
            border: none;
            font-size: 2.2rem;
            color: #bbb;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 2;
            padding: 0;
            line-height: 1;
            width: auto;
            height: auto;
        }
        #closeClassModalBtn:hover {
            color: #a00000;
        }
    </style>
</head>
<body style="position: relative; padding-top: 48px;"> <!-- Added padding-top here -->
    <!-- Top Navigation Bar -->
    <div id="topBar">
        <span id="pageTitle">Schoolola Admin Page</span>
        <div id="userDropdown">
            <button id="userButton">Tarneit ▼</button>
            <div id="dropdownContent">
                <a href="#" onclick="logout()">Log Out</a>
            </div>
        </div>
    </div>

    <!-- Side Menu -->
    <div id="sideMenu">
        <button class="menuButton" onclick="goToDashboard()">Dashboard</button>
        <button class="menuButton" onclick="goToSignInSignOut()">Students</button>
        <button class="menuButton" onclick="goToSignIn()">Sign In/Sign Out</button>
        <button class="menuButton" onclick="goToClasses()">Classes</button>
    </div>

    <!-- Main Content -->
    <div id="mainContent">    
        <!-- Add Class Button (now above the classes list) -->
        <button id="addClassBtn" style="margin: 40px 0 32px 0; background:#a00000; color:#fff; border:none; border-radius:6px; padding:10px 22px; font-size:16px; font-weight:600; display:block;">Add Class</button>

        <!-- Classes List -->
        <div id="classesListContainer" style="margin-top:0;">
            <h2 style="color:#191919;">All Classes</h2>
            <div id="classesButtons" style="display:flex; flex-wrap:wrap; gap:14px;"></div>
        </div>

        <!-- Add Class Form Modal (hidden by default) -->
        <div id="addClassFormContainer" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.25); z-index:1000; align-items:center; justify-content:center;">
            <form id="addClassForm" style="
                background: #fff;
                padding: 32px 32px 24px 32px;
                border-radius: 12px;
                box-shadow: 0 4px 16px rgba(0,0,0,0.12);
                min-width: 280px;
                max-width: 95vw;
                margin: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
            ">
                <h2 style="margin-top:0; color:#007bff; margin-bottom: 18px;">Add Class</h2>
                <div style="width:100%; margin-bottom: 16px;">
                    <label style="display:block; text-align:left; margin-bottom:6px; font-weight:600;">Grade</label>
                    <select id="classGrade" required class="formField">
                        <option value="" selected disabled>Select Grade</option>
                        <option value="Prep">Prep</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </div>
                <div style="width:100%; margin-bottom: 16px;">
                    <label style="display:block; text-align:left; margin-bottom:6px; font-weight:600;">Day</label>
                    <select id="classDay" required class="formField">
                        <option value="" selected disabled>Select Day</option>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                    </select>
                </div>
                <div style="width:100%; margin-bottom: 16px;">
                    <label style="display:block; text-align:left; margin-bottom:6px; font-weight:600;">Start Time</label>
                    <!-- Change the time input style to match the selects exactly -->
                    <input type="time" id="classStartTime" required class="formField">
                </div>
                <div style="width:100%; margin-bottom: 16px;">
                    <label style="display:block; text-align:left; margin-bottom:6px; font-weight:600;">End Time</label>
                    <input type="time" id="classEndTime" required class="formField">
                </div>
                <button type="submit" style="background:#007bff; color:#fff; border:none; border-radius:5px; padding:10px 22px; font-size:16px; font-weight:600; width:100%; margin-bottom:8px;">Submit</button>
                <button type="button" id="cancelAddClassBtn" style="background:#6c757d; color:#fff; border:none; border-radius:5px; padding:10px 22px; font-size:16px; width:100%;">Cancel</button>
                <div id="addClassError" style="color:#d32f2f; margin-top:10px; display:none; text-align:center;"></div>
            </form>
        </div>

        <!-- Class Modal (hidden by default) -->
        <div id="classModal" style="
            display:none; 
            position:fixed; 
            top:0; left:0; 
            width:100vw; height:100vh; 
            background:rgba(0,0,0,0.32); 
            z-index:2000; 
            align-items:center; 
            justify-content:center;
        ">
            <div id="classModalContent" style="
                background:#fff;
                padding:48px 40px 32px 40px;
                border-radius:22px;
                box-shadow:0 12px 40px rgba(0,0,0,0.20);
                min-width:380px;
                max-width:96vw;
                margin:auto;
                display:flex;
                flex-direction:column;
                align-items:center;
                position:relative;
                transition: box-shadow 0.2s;
                gap: 0.5rem;
            ">
                <!-- Close button for the modal -->
                <button id="closeClassModalBtn">&times;</button>
                
                <h2 id="modalClassTitle" style="margin:32px 0 10px 0; color:#151515; font-size:2.1rem; font-weight:700;">Class Details</h2>
                <div id="modalClassInfo" style="margin-bottom:18px; text-align:left; width:100%; font-size:1.15rem; background:#f6f8fa; border-radius:10px; padding:14px 18px;"></div>
                <button id="assignStudentsBtn" style="background:#a00000; color:#fff; border:none; border-radius:8px; padding:13px 0; font-size:17px; font-weight:600; width:100%; margin-bottom:18px; transition:background 0.2s;">Assign Students</button>
                <div id="assignStudentsSection" style="display:none; width:100%; margin-bottom:14px;">
                    <label style="font-weight:600; margin-bottom:8px; display:block;">Select Student:</label>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <select id="studentSelect" class="formField" style="margin-bottom:0;">
                            <option value="" selected disabled>Select student</option>
                        </select>
                        <button id="addStudentToClassBtn" style="background:#28a745; color:#fff; border:none; border-radius:5px; padding:10px 22px; font-size:16px; font-weight:600;">Add</button>
                    </div>
                </div>
                <div style="width:100%; margin-top:16px;">
                    <label style="font-weight:600;">Assigned Students:</label>
                    <ul id="assignedStudentsList" style="list-style:none; padding:0; margin:0; min-height:32px;"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        // Redirect to login.html if the user is not logged in
        if (!sessionStorage.getItem("isLoggedIn")) {
            window.location.href = "login.html";
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBBzeRD9aIT7PSI3-JI-2jeyrcqLL6csh4",
            authDomain: "schoololatest.firebaseapp.com",
            databaseURL: "https://schoololatest-default-rtdb.firebaseio.com",
            projectId: "schoololatest",
            storageBucket: "schoololatest.appspot.com",
            messagingSenderId: "359042307109",
            appId: "1:359042307109:web:cd0d43223f1fc588bbdbcc",
            measurementId: "G-V11YZN2F1Y"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth();

        onAuthStateChanged(auth, user => {
            if (user) {
                console.log("Authenticated as:", user.email || user.uid);
            } else {
                console.log("NOT authenticated!");
            }
        });

        window.logout = () => {
            sessionStorage.removeItem("isLoggedIn"); // Clear the login session
            window.location.href = "index.html"; // Redirect to the index page
        };

        window.goToDashboard = () => window.location.href = "admin.html";
        window.goToSignIn = () => window.location.href = "signingin.html";
        window.goToSignInSignOut = () => window.location.href = "students.html";
        window.goToClasses = () => window.location.href = "classes.html";

        // Add Class functionality
        document.getElementById('addClassBtn').addEventListener('click', () => {
            document.getElementById('addClassFormContainer').style.display = 'flex';
        });

        document.getElementById('cancelAddClassBtn').addEventListener('click', () => {
            document.getElementById('addClassFormContainer').style.display = 'none';
        });

        // Save class to database and update table
        document.getElementById('addClassForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const grade = document.getElementById('classGrade').value;
            const day = document.getElementById('classDay').value;
            const startTime = document.getElementById('classStartTime').value;
            const endTime = document.getElementById('classEndTime').value;

            if (!grade || !day || !startTime || !endTime) {
                document.getElementById('addClassError').innerText = 'Please fill in all fields.';
                document.getElementById('addClassError').style.display = 'block';
                return;
            }

            document.getElementById('addClassError').style.display = 'none';

            // Save to Firebase under /classes/
            try {
                await push(ref(db, 'classes'), {
                    grade,
                    day,
                    startTime,
                    endTime
                });
                document.getElementById('addClassFormContainer').style.display = 'none';
                document.getElementById('addClassForm').reset();
                alert('Class added successfully!');
            } catch (err) {
                document.getElementById('addClassError').innerText = 'Failed to add class. Please try again.';
                document.getElementById('addClassError').style.display = 'block';
            }
        });

        // Class Modal logic
        const classModal = document.getElementById('classModal');
        const modalClassTitle = document.getElementById('modalClassTitle');
        const modalClassInfo = document.getElementById('modalClassInfo');
        const assignStudentsBtn = document.getElementById('assignStudentsBtn');
        const assignStudentsSection = document.getElementById('assignStudentsSection');
        const studentSelect = document.getElementById('studentSelect');
        const addStudentToClassBtn = document.getElementById('addStudentToClassBtn');
        const assignedStudentsList = document.getElementById('assignedStudentsList');
        const closeClassModalBtn = document.getElementById('closeClassModalBtn');
        if (closeClassModalBtn) {
            closeClassModalBtn.onclick = () => {
                document.getElementById('classModal').style.display = 'none';
            };
        }

        let currentClassId = null;
        let currentClassData = null;

        // Show modal for a class
        function openClassModal(classId, classData) {
            currentClassId = classId;
            currentClassData = classData;
            modalClassTitle.textContent = `Grade: ${classData.grade}`;
            modalClassInfo.innerHTML = `
                <div><b>Day:</b> ${classData.day}</div>
                <div><b>Start:</b> ${classData.startTime}</div>
                <div><b>End:</b> ${classData.endTime}</div>
            `;
            assignStudentsSection.style.display = "none";
            classModal.style.display = "flex";
            loadAssignedStudents();
        }
        

        // Show assign students section and load students in same grade
        assignStudentsBtn.onclick = () => {
            assignStudentsSection.style.display = "block";
            loadGradeStudents(currentClassData.grade);
        };

        // Load all students in the same grade and populate the select
        function loadGradeStudents(grade) {
            studentSelect.innerHTML = '<option value="" selected disabled>Loading...</option>';
            import('https://www.gstatic.com/firebasejs/11.7.1/firebase-database.js').then(({ get, child, ref }) => {
                get(child(ref(db), `grades/${grade}/names`)).then(snapshot => {
                    studentSelect.innerHTML = '<option value="" selected disabled>Select student</option>';
                    if (snapshot.exists()) {
                        let names = snapshot.val();
                        if (!Array.isArray(names)) names = Object.values(names);
                        names.forEach(entry => {
                            const name = typeof entry === "string" ? entry : entry.name;
                            if (name) {
                                const option = document.createElement("option");
                                option.value = name;
                                option.textContent = name;
                                studentSelect.appendChild(option);
                            }
                        });
                    } else {
                        studentSelect.innerHTML = '<option value="" disabled>No students found</option>';
                    }
                });
            });
        }

        // Add student to class in Firebase
        addStudentToClassBtn.onclick = async () => {
            const name = studentSelect.value;
            if (!name) return;
            // Prevent duplicate assignment
            const studentsRef = ref(db, `classes/${currentClassId}/students`);
            let alreadyAssigned = false;
            await onValue(studentsRef, (snapshot) => {
                snapshot.forEach(child => {
                    if (child.val() === name) alreadyAssigned = true;
                });
            }, { onlyOnce: true });
            if (alreadyAssigned) {
                alert("Student already assigned to this class.");
                return;
            }
            await push(studentsRef, name);
            studentSelect.value = "";
            loadAssignedStudents();
        };

        // Load assigned students from Firebase
        function loadAssignedStudents() {
            assignedStudentsList.innerHTML = '<li style="color:#888;">Loading...</li>';
            const studentsRef = ref(db, `classes/${currentClassId}/students`);
            onValue(studentsRef, (snapshot) => {
                assignedStudentsList.innerHTML = '';
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const li = document.createElement('li');
                        li.textContent = child.val();
                        assignedStudentsList.appendChild(li);
                    });
                } else {
                    assignedStudentsList.innerHTML = '<li style="color:#888;">No students assigned.</li>';
                }
            }, { onlyOnce: true });
        }

        // Load and display all classes
        function loadClasses() {
            const buttonsDiv = document.getElementById('classesButtons');
            onValue(ref(db, 'classes'), (snapshot) => {
                buttonsDiv.innerHTML = '';
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const c = child.val();
                        const classId = child.key;
                        const btn = document.createElement('div');
                        btn.style.background = '#fff';
                        btn.style.border = '2px solid #a00000'; // changed from #007bff (blue) to #a00000 (red)
                        btn.style.color = '#222';
                        btn.style.borderRadius = '14px';
                        btn.style.padding = '18px 28px';
                        btn.style.fontSize = '17px';
                        btn.style.fontWeight = '500';
                        btn.style.margin = '0';
                        btn.style.cursor = 'pointer';
                        btn.style.display = 'flex';
                        btn.style.flexDirection = 'column';
                        btn.style.alignItems = 'flex-start';
                        btn.style.boxShadow = '0 2px 10px rgba(0,0,0,0.07)';
                        btn.style.transition = 'box-shadow 0.2s, border-color 0.2s';
                        btn.onmouseenter = () => {
                            btn.style.boxShadow = '0 4px 18px rgba(160,0,0,0.13)';
                            btn.style.borderColor = '#7a0000'; // darker red on hover
                        };
                        btn.onmouseleave = () => {
                            btn.style.boxShadow = '0 2px 10px rgba(0,0,0,0.07)';
                            btn.style.borderColor = '#a00000';
                        };
                        btn.innerHTML = `
                            <span style="font-size:20px; font-weight:700;">Grade: ${c.grade}</span>
                            <span style="margin-top:2px;">Day: <b>${c.day}</b></span>
                            <span style="margin-top:2px;">Start: <b>${c.startTime}</b></span>
                            <span style="margin-top:2px;">End: <b>${c.endTime}</b></span>
                        `;
                        btn.onclick = () => openClassModal(classId, c);
                        buttonsDiv.appendChild(btn);
                    });
                } else {
                    buttonsDiv.innerHTML = '<span style="color:#888;">No classes found.</span>';
                }
            });
        }

        loadClasses();
    </script>
</body>
</html>
