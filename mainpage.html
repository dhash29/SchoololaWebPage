// Fetch names from Firebase and display them
function showSecondDropdown() {
    const grade = document.getElementById("YrLevel").value; // Get the selected grade
    const namesDropdown = document.getElementById("Names");
    const secondDropdown = document.getElementById("secondDropdown");
    const actionType = document.getElementById("actionType").value; // Get the action type (Sign In or Sign Out)

    // Clear existing options and show "Loading..."
    namesDropdown.innerHTML = '<option value="loading">Loading...</option>';
    secondDropdown.style.display = "block";

    console.log(`Fetching names for grade: ${grade} and action: ${actionType}`);

    // Fetch names from Firebase
    get(child(ref(database), `grades/${grade}/names`))
        .then(snapshot => {
            namesDropdown.innerHTML = '<option value="placeholder" selected disabled>Select your name</option>';
            if (snapshot.exists()) {
                let names = snapshot.val();

                // Convert object to array if needed
                if (!Array.isArray(names)) {
                    names = Object.values(names);
                }

                // Now names is always an array of either {name: "X"} or just "X"
                const promises = names
    .filter(entry => entry && (typeof entry === "string" || entry.name)) // skip null/empty
    .map(entry => {
        const studentName = typeof entry === "string" ? entry : entry.name;
        const userStatusRef = ref(database, `records/${grade}/${studentName}/status`);
        return get(userStatusRef).then(statusSnapshot => {
            const status = statusSnapshot.val();
            return { name: studentName, status: status };
        });
    });

                // Wait for all status checks to complete
                Promise.all(promises).then(results => {
                    results.forEach(({ name, status }) => {
//                        console.log("Name:", name, "Status:", status, "Action:", actionType);
                        if (actionType === "Sign In" && status !== "Signed In") {
                            // Add names that are not signed in to the "Sign In" dropdown
                            const option = document.createElement("option");
                            option.value = name;
                            option.textContent = name;
                            namesDropdown.appendChild(option);
                        } else if (actionType === "Sign Out" && status === "Signed In") {
                            // Add names that are signed in to the "Sign Out" dropdown
                            const option = document.createElement("option");
                            option.value = name;
                            option.textContent = name;
                            namesDropdown.appendChild(option);
                        }
                    });

                    // If no names are available for the selected action
                    if (namesDropdown.children.length === 1) {
                        const message =
                            actionType === "Sign In"
                                ? "No names available for signing in"
                                : "No names available for signing out";
                        namesDropdown.innerHTML = `<option value="none" disabled>${message}</option>`;
                    }
                });
            } else {
                namesDropdown.innerHTML = '<option value="none" disabled>No names available in this grade</option>';
            }
        })
        .catch(error => {
            console.error("Error fetching names:", error);
            alert("Failed to load names. Please try again.");
        });
}

// Submit sign-in/sign-out data to Firebase
function submitForm() {
    const form = document.getElementById("signInForm");
    const formData = new FormData(form);
    const actionType = formData.get("actionType"); // Sign In or Sign Out
    const grade = formData.get("YrLevel"); // Selected grade
    const name = formData.get("Names"); // Selected name
    const now = new Date();

    if (!grade || !name) {
        alert("Please select your grade and name.");
        return;
    }

    // Reference to the user's status in Firebase
    const userStatusRef = ref(database, `records/${grade}/${name}/status`);

    // Check the user's current status
    get(userStatusRef)
        .then(snapshot => {
            const currentStatus = snapshot.val();

            if (actionType === "Sign In" && currentStatus === "Signed In") {
                alert("You are already signed in. You cannot sign in again.");
                return;
            }

            if (actionType === "Sign Out" && currentStatus !== "Signed In") {
                alert("You cannot sign out because you haven't signed in yet.");
                return;
            }

            // Format date and time separately
            const date = now.getFullYear() + "-" +
                String(now.getMonth() + 1).padStart(2, "0") + "-" +
                String(now.getDate()).padStart(2, "0");
            const time = now.toLocaleTimeString("en-AU", { hour12: false });

            // Push the data to Firebase
            const recordRef = ref(database, `records/${grade}/${name}/history`);
            push(recordRef, {
                action: actionType,
                date: date,
                time: time
            })
            .then(() => {
                // Update the user's status in Firebase
                set(userStatusRef, actionType === "Sign In" ? "Signed In" : "Signed Out")
                    .then(() => {
                        alert(`${actionType} recorded successfully at ${date} ${time}!`);

                        // Reset the form and redirect to the start
                        form.reset();
                        document.getElementById("secondDropdown").style.display = "none";
                        document.getElementById("formContainer").style.display = "none";
                        document.getElementById("actionButtons").style.display = "block";
                    });
            })
            .catch(error => {
                console.error("Error saving data:", error);
                alert("Failed to record data. Please try again.");
            });
        })
        .catch(error => {
            console.error("Error checking user status:", error);
            alert("Failed to check user status. Please try again.");
        });
}

    }

        String(now.getDate()).padStart(2, "0");
    const time = now.toLocaleTimeString("en-AU", { hour12: false });

    const recordRef = ref(database, `records/${guestGrade}/${guestName}/history`);

        action: guestAction,

    })
    .then(() => {

        alert("Failed to record guest data. Please try again.");
    });
}

// Logs Button and Popup

function showLogsForToday() {
    logsContent.innerHTML = 'Loading...';
    document.getElementById('signedInList').innerHTML = 'Loading...';
    const today = new Date();
    const dateStr = today.getFullYear() + "-" +
        String(today.getMonth() + 1).padStart(2, "0") + "-" +
        String(today.getDate()).padStart(2, "0");

    const grades = ["Prep", "Grade 1", "Grade 2", "Grade 3", "Grade 4", "Grade 5", "Grade 6"];
    const db = getDatabase();

    // Remove previous listeners if any
    if (window._logsListeners) {
        window._logsListeners.forEach(unsub => unsub());
    }
    window._logsListeners = [];

    let allLogs = [];
    let allSignedIn = [];

    grades.forEach(grade => {
        const recordsRef = ref(db, `records/${grade}`);
        const unsubscribe = onValue(recordsRef, (recordsSnap) => {
            // Remove previous logs and signed-in for this grade
            allLogs = allLogs.filter(log => log.grade !== grade);
            allSignedIn = allSignedIn.filter(s => s.grade !== grade);

            if (recordsSnap.exists()) {
                const students = recordsSnap.val();
                Object.entries(students).forEach(([studentName, studentData]) => {
                    // Signed In List
                    if (studentData.status === "Signed In") {
                        allSignedIn.push({ name: studentName, grade });
                    }
                    // Logs
                    if (studentData.history) {
                        Object.values(studentData.history).forEach(rec => {
                            if (rec.date === dateStr) {
                                allLogs.push({
                                    name: studentName,
                                    grade: grade,
                                    action: rec.action,
                                    time: rec.time || "",
                                });
                            }
                        });
                    }
                });
            }
            // Update Signed In List
            const signedInList = document.getElementById('signedInList');
            if (allSignedIn.length === 0) {
                signedInList.innerHTML = '<div style="color:#888;">None</div>';
            } else {
                // Sort alphabetically
                allSignedIn.sort((a, b) => a.name.localeCompare(b.name));
                signedInList.innerHTML = allSignedIn.map(s =>
                    `<div>${s.name}</div>`
                ).join('');
            }
            // Update Logs
            if (allLogs.length === 0) {
                logsContent.innerHTML = '<div style="color:#888;">No sign in/out records for today.</div>';
            } else {
                allLogs.sort((a, b) => (a.time > b.time ? 1 : -1));
                logsContent.innerHTML = allLogs.map(log =>
                    `<div style="margin-bottom:6px;">
                        <b>${log.name}</b> (${log.grade}) 
                        <span style="color:${log.action === 'Sign In' ? '#009900' : '#a00000'}; font-weight:600;">
                            ${log.action}
                        </span>
                        <span style="color:#555;">at ${log.time}</span>
                    </div>`
                ).join('');
            }
        });
        window._logsListeners.push(unsubscribe);
    });
}

function updateSignedInList() {

    const signedInListDiv = document.getElementById('signedInList');

    if (window._signedInListeners) {
        window._signedInListeners.forEach(unsub => unsub());
    }
    window._signedInListeners = [];

    grades.forEach(grade => {
        const recordsRef = ref(db, `records/${grade}`);
        const unsubscribe = onValue(recordsRef, (recordsSnap) => {
            // Remove previous signed-in for this grade
            allSignedIn = allSignedIn.filter(s => s.grade !== grade);

            if (recordsSnap.exists()) {
                const students = recordsSnap.val();
                Object.entries(students).forEach(([studentName, studentData]) => {
                    if (studentData.status === "Signed In") {

                    `<div>${s.name}</div>`
                ).join('');
            }
        });
        window._signedInListeners.push(unsubscribe);
    });
}
